{{define "content"}}
<div class="narrow">
<h1>Admin</h1>
{{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
<form class="sheet" method="post" action="/admin/login">
<label class="field"><span>Token</span><input class="input mono" name="token" type="password" autocomplete="off" autofocus required></label>
<div class="form-actions"><button class="btn btn-primary">Enter</button></div>
</form>
<p class="hint">The token comes from <span class="mono">RADIOPATH_ADMIN_TOKEN</span> in the server environment. It is not a user account, and this panel keeps working even when no user is left.</p>
</div>
{{end}}
