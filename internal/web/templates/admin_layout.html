<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radiopath admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>(function(){try{var t=localStorage.getItem("cp-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}})()</script>
<style>
@font-face { font-family: "IBM Plex Sans"; src: url(/fonts/IBMPlexSans-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(/fonts/IBMPlexSans-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
:root { color-scheme: light; --bg: #f6f7f8; --surface: #fff; --line: #dcdfe4; --line-soft: #eceef1; --fg: #14171b; --muted: #5c6470; --accent: #1a5fb4; --ok: #2e7d32; --warn: #8a5a00; --danger: #a40000; }
[data-theme="dark"] { color-scheme: dark; --bg: #0f1114; --surface: #16191e; --line: #2b3038; --line-soft: #21252b; --fg: #e7e9ec; --muted: #99a1ad; --accent: #5b9dff; --ok: #5fd07a; --warn: #e0a33a; --danger: #ff7a7a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
h1 { margin: 0; font-size: 18px; font-weight: 600; }
p, form { margin: 0; }
.mono, .num, input.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.muted { color: var(--muted); }
header { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
header .brand { font-size: 13px; font-weight: 600; color: var(--fg); margin-right: auto; }
main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.narrow { max-width: 26rem; margin: 40px auto 0; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.narrow h1 { margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.row .end { margin-left: auto; }
.split { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1024px) { .split { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
.panel, .sheet { border: 1px solid var(--line); background: var(--surface); padding: 12px 16px; margin-bottom: 16px; }
.sheet { padding: 16px; }
fieldset { border: 0; margin: 0; padding: 0; }
legend { width: 100%; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); font-size: 12px; font-weight: 500; color: var(--muted); }
.field { display: grid; grid-template-columns: 9rem minmax(0, 1fr); align-items: center; gap: 4px 16px; padding: 3px 0; }
.field > span { font-size: 13px; color: var(--muted); }
.input { height: 32px; width: 100%; max-width: 17rem; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; }
.input.wide { max-width: 22rem; }
.btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--line-soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.btn-primary:hover { background: color-mix(in oklab, var(--fg) 85%, var(--bg)); }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); }
.form-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
.alert { margin-bottom: 16px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
.alert ul { margin: 0; padding-left: 20px; }
.alert-error { border-color: var(--danger); color: var(--danger); background: color-mix(in oklab, var(--danger) 8%, var(--surface)); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 6px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--muted); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-done { border-color: var(--ok); color: var(--ok); }
.badge-queued { border-color: var(--warn); color: var(--warn); }
.badge-failed { border-color: var(--danger); color: var(--danger); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
td { padding: 6px 12px; border-bottom: 1px solid var(--line-soft); }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; white-space: nowrap; }
.small { font-size: 12px; }
.row-actions { text-align: right; white-space: nowrap; }
.row-actions form { display: inline; }
.empty { padding: 24px 12px; text-align: center; color: var(--muted); }
.table-note { margin-top: 8px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
<a class="brand" href="/admin">Radiopath admin</a>
<button class="btn" type="button" id="theme-toggle" title="Light / dark">Light / dark</button>
{{if .Admin}}<form method="post" action="/admin/logout"><button class="btn">Logout</button></form>{{end}}
</header>
<main>
{{template "content" .}}
</main>
<script>
document.getElementById('theme-toggle').addEventListener('click', function () {
  var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cp-theme', t); } catch (e) { }
});
// A random password with lower and upper case, a digit and a symbol, generated in the browser.
function cpPassword() {
  var alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!#%*+-?';
  for (;;) {
    var bytes = new Uint8Array(20), out = '';
    crypto.getRandomValues(bytes);
    for (var i = 0; i < bytes.length; i++) { out += alpha[bytes[i] & 63]; }
    if (/[a-z]/.test(out) && /[A-Z]/.test(out) && /[2-9]/.test(out) && /[!#%*+\-?]/.test(out)) { return out; }
  }
}
document.querySelectorAll('form[data-confirm]').forEach(function (form) {
  form.addEventListener('submit', function (e) { if (!confirm(form.dataset.confirm)) { e.preventDefault(); } });
});
document.querySelectorAll('button[data-generate]').forEach(function (btn) {
  var input = document.getElementById(btn.dataset.generate);
  if (!input.value) { input.value = cpPassword(); }
  btn.addEventListener('click', function () { input.value = cpPassword(); input.focus(); input.select(); });
});
</script>
</body>
</html>
