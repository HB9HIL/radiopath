<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			try {
				let t = localStorage.getItem('cp-theme');
				if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
			} catch {}
			// A tab opened before a deploy asks for chunks the new build no longer has: load the new build instead,
			// at most once a minute so a build that is really broken does not reload forever.
			addEventListener('vite:preloadError', (e) => {
				try {
					if (Date.now() - Number(sessionStorage.getItem('cp-reload')) < 60000) return;
					sessionStorage.setItem('cp-reload', String(Date.now()));
				} catch {
					return;
				}
				e.preventDefault();
				location.reload();
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
