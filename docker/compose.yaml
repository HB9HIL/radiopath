# name: without it Compose derives the project name from the docker/ directory and the volumes move.
name: radiopath

services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: radiopath
      POSTGRES_PASSWORD: radiopath
      POSTGRES_DB: radiopath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "radiopath"]
      interval: 1s
      retries: 30

  valkey:
    image: valkey/valkey:9.1-alpine
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "1025:1025"
      - "8025:8025"

  # Stylesheet build, run by the Makefile (make css, make dev); never started by up.
  node:
    image: node:26-alpine
    profiles: [tools]
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - ..:/src

volumes:
  pgdata:
