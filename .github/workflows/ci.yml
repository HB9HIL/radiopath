name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp internal/web/static/app.css committed.css
      - run: make css
      - run: cmp committed.css internal/web/static/app.css || { echo "app.css is stale, run 'make css' and commit"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: e2e/test-results/

  staging-image:
    needs: [test, lint-css, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: staging-image
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Parallel pushes race; an older run finishing last would overwrite :staging.
      - id: latest
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past $GITHUB_SHA, not overwriting :staging"
          fi
      - id: version
        if: steps.latest.outputs.ok
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.latest.outputs.ok
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.latest.outputs.ok
      - uses: docker/build-push-action@v7
        if: steps.latest.outputs.ok
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:staging
